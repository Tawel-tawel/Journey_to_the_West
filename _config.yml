title: Journey to the West
subtitle: 用脚步丈量世界，用 Git 管理记忆
description: 旅行足迹、游记、攻略、照片和城市记忆。
keywords: travel, blog, Hexo, Journey to the West
author: Tawel
language: zh-CN
timezone: Asia/Shanghai

url: https://tawel-tawel.github.io/Journey_to_the_West
root: /Journey_to_the_West/
permalink: posts/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - README.md

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
ignore:
  - 'tools/**/*'
  - 'templates/**/*'
  - 'scaffolds/**/*'
  - 'docs/**/*'
  - 'assets/**/*'
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

index_generator:
  path: ''
  per_page: 10
  order_by: -date

archive_generator:
  per_page: 20
  yearly: true
  monthly: true

tag_generator:
  per_page: 20
  enable_index_page: true

category_generator:
  per_page: 20

default_category: travel
category_map:
tag_map:

meta_generator: true

date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime

per_page: 10
pagination_dir: page

theme: journey

deploy:
  type: git
  repo: https://github.com/Tawel-tawel/Journey_to_the_West.git
  branch: gh-pages
